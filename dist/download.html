<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>下载主题文件</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 720px;
        margin: 60px auto;
        padding: 0 20px;
        color: #1f2937;
        background: #f9fafb;
      }
      h1 { font-size: 22px; margin-bottom: 8px; }
      p { color: #4b5563; line-height: 1.6; }
      button {
        margin-top: 16px;
        padding: 10px 18px;
        background: #111827;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      pre {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        padding: 12px;
        max-height: 360px;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>NodeGet 主题文件下载</h1>
    <p>
      该页面会读取本站点根目录下的
      <code>nodeget-theme-files.json</code> 文件列表，并将所有主题资源打包为
      <code>theme.zip</code> 供你下载。
    </p>
    <button id="btn">开始打包并下载</button>
    <pre id="log"></pre>
    <script
      src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
      crossorigin="anonymous"
    ></script>
    <script>
      const btn = document.getElementById('btn');
      const log = document.getElementById('log');
      const append = (msg) => {
        log.textContent += msg + '\n';
        log.scrollTop = log.scrollHeight;
      };
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        log.textContent = '';
        try {
          append('加载文件列表 nodeget-theme-files.json ...');
          const res = await fetch('./nodeget-theme-files.json', { cache: 'no-cache' });
          if (!res.ok) throw new Error('无法读取 nodeget-theme-files.json: ' + res.status);
          const data = await res.json();
          const files = Array.isArray(data) ? data : data.files || [];
          append('共 ' + files.length + ' 个文件');
          const zip = new JSZip();
          let i = 0;
          for (const f of files) {
            i++;
            try {
              const r = await fetch('./' + f, { cache: 'no-cache' });
              if (!r.ok) throw new Error(r.status);
              const buf = await r.arrayBuffer();
              zip.file(f, buf);
              if (i % 5 === 0 || i === files.length) {
                append('[' + i + '/' + files.length + '] ' + f);
              }
            } catch (e) {
              append('跳过 ' + f + ': ' + e);
            }
          }
          append('生成 zip ...');
          const blob = await zip.generateAsync({ type: 'blob' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'theme.zip';
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          append('完成');
        } catch (e) {
          append('错误: ' + (e && e.message ? e.message : e));
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
